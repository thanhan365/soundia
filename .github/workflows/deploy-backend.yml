name: Deploy Backend to MonsterASP

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: dotnet publish backend/Soundia.Api.csproj -c Release -o ./publish

      - name: Setup Node.js for Zing scripts
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zing script dependencies
        run: |
          cd backend/scripts
          npm install zingmp3-api-full 2>/dev/null || true

      - name: Copy scripts to publish
        run: |
          cp -r backend/scripts ./publish/scripts

      - name: Update appsettings.json
        env:
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          NCT_KEY: ${{ secrets.NCT_API_KEY }}
          NCT_SECRET: ${{ secrets.NCT_SECRET_KEY }}
          SPOTIFY_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 -c "
          import json, os
          config = {
            'ConnectionStrings': {'DefaultConnection': os.environ['DB_CONN']},
            'Jwt': {'Key': os.environ['JWT_KEY'], 'Issuer': 'SoundiaApp', 'Audience': 'SoundiaUsers'},
            'Nct': {'ApiUrl': 'https://beta.nhaccuatui.com/api', 'ApiKey': os.environ['NCT_KEY'], 'SecretKey': os.environ['NCT_SECRET']},
            'Spotify': {'ClientId': os.environ['SPOTIFY_ID'], 'ClientSecret': os.environ['SPOTIFY_SECRET']},
            'Logging': {'LogLevel': {'Default': 'Warning', 'Microsoft.AspNetCore': 'Warning'}},
            'AllowedHosts': '*'
          }
          with open('./publish/appsettings.json', 'w') as f:
            json.dump(config, f, indent=2)
          "

      - name: Update web.config for OutOfProcess
        run: |
          python3 -c "
          xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <configuration>
            <location path=\".\" inheritInChildApplications=\"false\">
              <system.webServer>
                <handlers>
                  <add name=\"aspNetCore\" path=\"*\" verb=\"*\" modules=\"AspNetCoreModuleV2\" resourceType=\"Unspecified\" />
                </handlers>
                <aspNetCore processPath=\"dotnet\" arguments=\".\\\\Soundia.Api.dll\" stdoutLogEnabled=\"true\" stdoutLogFile=\".\\\\logs\\\\stdout\" hostingModel=\"OutOfProcess\" />
              </system.webServer>
            </location>
          </configuration>'''
          import textwrap
          with open('./publish/web.config', 'w', encoding='utf-8') as f:
            f.write(textwrap.dedent(xml).strip())
          print('web.config written successfully')
          "

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: true
